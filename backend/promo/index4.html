<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedPad | Güvenli Besleme Platformu</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    <style>
        :root {
            --primary-blue: #9DB8E8; /* Logonun ana mavi tonu */
            --dark-blue: #5A7FA1;    /* Başlık ve vurgu tonu */
            --soft-bg: #E8F1FA;      /* Arka plan pastel mavi */
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--white); overflow-x: hidden; }

        /* --- Modern Appbar (Beranet Örneği Gibi) --- */
        nav {
            background-color: var(--white);
            padding: 0.8rem 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .logo-area { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-area img { height: 50px; } /* Mavi patili logonuz */
        .logo-area span { color: var(--dark-blue); font-size: 1.5rem; font-weight: 700; }

        .nav-menu { display: flex; list-style: none; gap: 2rem; }
        .nav-menu a { 
            color: var(--dark-blue); 
            text-decoration: none; 
            font-weight: 500; 
            font-size: 0.95rem;
            transition: 0.3s;
        }
        .nav-menu a:hover { color: var(--primary-blue); }

        .nav-cta {
            background-color: var(--primary-blue);
            color: var(--white);
            padding: 0.6rem 1.8rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }
        .nav-cta:hover { background-color: var(--dark-blue); transform: scale(1.05); }

        /* --- Main (Hero) Section --- */
        .main-hero {
            height: 100vh;
            background: radial-gradient(circle at top right, var(--soft-bg) 0%, var(--white) 70%);
            display: flex;
            align-items: center;
            padding: 0 10%;
            padding-top: 80px;
        }

        .hero-text-content { flex: 1; }
        .hero-text-content h1 { 
            font-size: 4rem; 
            color: var(--dark-blue); 
            line-height: 1.1; 
            margin-bottom: 20px;
        }
        .hero-text-content p { 
            font-size: 1.2rem; 
            color: #78909C; 
            margin-bottom: 35px; 
            max-width: 500px; 
        }

        /* Görsel Alanı */
        .hero-graphic { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center;
        }
        .floating-logo {
            width: 400px;
            filter: drop-shadow(0 30px 50px rgba(157, 184, 232, 0.4));
            animation: bounce 5s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-25px); }
        }

        /* --- Siber Güvenlik Badge Alanı --- */
        .security-row {
            padding: 20px 10%;
            background-color: var(--soft-bg);
            display: flex;
            justify-content: center;
            gap: 50px;
            border-top: 1px solid rgba(0,0,0,0.05);
        }
        .sec-badge { display: flex; align-items: center; gap: 10px; color: var(--dark-blue); font-size: 0.9rem; font-weight: 600; }
        .sec-badge i { color: var(--primary-blue); font-size: 1.4rem; }

        @media (max-width: 992px) {
            .main-hero { flex-direction: column; text-align: center; justify-content: center; }
            .nav-menu { display: none; }
            .hero-text-content h1 { font-size: 2.8rem; }
            .floating-logo { width: 280px; margin-top: 40px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo-area">
            <img src="logo.png" alt="FeedPad Logo"> <span>FeedPad</span>
        </a>
        <ul class="nav-menu">
            <li><a href="#about">Kurumsal</a></li>
            <li><a href="#features">Özellikler</a></li>
            <li><a href="#map">Besleme Haritası</a></li>
            <li><a href="#faq">SSS</a></li>
        </ul>
        <a href="#download" class="nav-cta">Hemen Katıl</a>
    </nav>

    <section class="main-hero">
        <div class="hero-text-content">
            <h1>Dostlarımız İçin<br><span style="color: var(--primary-blue)">Güvenli Patiler</span></h1>
            <p>Sokaktaki kedi ve köpeklerin beslenme noktalarını harita üzerinden takip edin, toplulukla güven içinde paylaşın.</p>
            <div style="display: flex; gap: 15px;">
                <button style="border: none; background: none; cursor: pointer;"><img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" height="45"></button>
                <button style="border: none; background: none; cursor: pointer;"><img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" height="45"></button>
            </div>
        </div>
        <div class="hero-graphic">
            <img src="logo.png" class="floating-logo" alt="FeedPad Visual">
        </div>
    </section>

    <div class="security-row">
        <div class="sec-badge"><i class="fas fa-lock"></i> SSL Sertifikalı</div>
        <div class="sec-badge"><i class="fas fa-user-shield"></i> KVKK Uyumlu Veri</div>
        <div class="sec-badge"><i class="fas fa-check-circle"></i> Doğrulanmış Kullanıcılar</div>
    </div>

</body>
</html>
