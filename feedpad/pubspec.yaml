name: pad_map
description: Flutter mobil uygulama - Kullanıcı girişi ve harita
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase - Güncellenmiş ve uyumlu versiyonlar
  firebase_core: ^2.27.1
  firebase_auth: ^4.17.9
  cloud_firestore: ^4.15.10
  
  # Google Maps
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  
  # State Management
  provider: ^6.1.2
  
  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

