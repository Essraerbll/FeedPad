name: pad_map
description: Flutter mobil uygulama - Kullanıcı girişi ve harita
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP Client
  http: ^1.1.0

  # State Management
  provider: ^6.1.2

  # Maps
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

  # Location
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
